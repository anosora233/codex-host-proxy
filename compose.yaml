services:
  proxy:
    build: .
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CODEX_WS_URL: "${CODEX_WS_URL:-ws://host.docker.internal:4500}"
      CODEX_WS_TOKEN: "${CODEX_WS_TOKEN:?Set CODEX_WS_TOKEN}"
      PROXY_API_KEY: "${PROXY_API_KEY:?Set PROXY_API_KEY}"
      CODEX_HOST_CWD: "${CODEX_HOST_CWD:?Set CODEX_HOST_CWD}"
      CODEX_HOST_IMAGE_DIR: "${CODEX_HOST_IMAGE_DIR:?Set CODEX_HOST_IMAGE_DIR}"
      PROXY_IMAGE_DIR: /images
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-300}"
    volumes:
      - type: bind
        source: "${CODEX_HOST_IMAGE_DIR}"
        target: /images
        bind:
          create_host_path: false
